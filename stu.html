  const ua = navigator.userAgent || '';
  if (/KAKAOTALK/i.test(ua)) window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
  else if (/NAVER/i.test(ua)) window.location.href = 'naversearchapp://inappbrowser?app=naversearchapp&url=' + encodeURIComponent(url);
  else window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
};
function showExternalBrowserBannerIfNeeded(bannerId) {
  if (detectInAppBrowser()) { const el = document.getElementById(bannerId); if (el) el.style.display = 'block'; }
}
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(str) { return esc(str).replace(/"/g, '&quot;'); }
function fuzzySearch(items, query, fields) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) return items;
  const qNorm = q.replace(/\s/g, '');
  return items.filter(item => fields.some(f => {
    const v = String(item[f] || '').toLowerCase();
    return v.includes(q) || v.replace(/\s/g, '').includes(qNorm);
  }));
}

let allStudents = [];
// { [grade]: { [sem]: [{id,label,order}, ...] } } — order로 정렬된 배열
let slotsByGradeSem = {};
let currentYear = null;
let currentSem = 1;
let activeGrade = '';
let activeBan = '';
// 슬롯 단위로 학생을 모아볼 때 사용 — 설정되면 학년/반 필터보다 우선한다.
let activityFilter = null; // { grade, sem, slotId, label, value }

function slotsFor(grade, sem) {
  return (slotsByGradeSem[String(grade)] && slotsByGradeSem[String(grade)][String(sem)]) || [];
}
function allSlotsForGrade(grade) {
  return slotsFor(grade, currentSem).map(s => ({ ...s, sem: currentSem }));
}

function studentSearchText(s) {
  const vals = Object.values(s.assignments || {});
  return [s.name, s.id, s.grade, s.ban, s.num, s.email, ...vals].join(' ');
}

function uniqueSorted(arr) {
  return [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
}

function gradesAvailable() {
  return uniqueSorted(allStudents.map(s => String(s.grade)));
}
function bansForGrade(grade) {
  return uniqueSorted(allStudents.filter(s => String(s.grade) === String(grade)).map(s => String(s.ban)));
}
function slotOptions(grade, slotId) {
  const vals = allStudents
    .filter(s => String(s.grade) === String(grade))
    .map(s => (s.assignments || {})[slotId])
    .filter(Boolean);
  return uniqueSorted(vals);
}

function renderGradeChips() {
  const wrap = document.getElementById('gradeChips');
  const grades = gradesAvailable();
  wrap.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (activeGrade === '' ? ' active' : '');
  allChip.textContent = '전체';
  allChip.onclick = () => { activeGrade = ''; activeBan = ''; clearActivityFilterSelects(); activityFilter = null; renderAll(); };
  wrap.appendChild(allChip);
  grades.forEach(g => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeGrade === g ? ' active' : '');
    chip.textContent = g + '학년';
    chip.onclick = () => { activeGrade = g; activeBan = ''; clearActivityFilterSelects(); activityFilter = null; renderAll(); };
    wrap.appendChild(chip);
  });

  const banRow = document.getElementById('banRow');
  if (activeGrade && !activityFilter) {
    banRow.style.display = 'block';
    const banWrap = document.getElementById('banChips');
    banWrap.innerHTML = '';
    const allBanChip = document.createElement('button');
    allBanChip.className = 'chip' + (activeBan === '' ? ' active' : '');
    allBanChip.textContent = '전체';
    allBanChip.onclick = () => { activeBan = ''; renderAll(); };
    banWrap.appendChild(allBanChip);
    bansForGrade(activeGrade).forEach(b => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (activeBan === b ? ' active' : '');
      chip.textContent = b + '반';
      chip.onclick = () => { activeBan = b; renderAll(); };
      banWrap.appendChild(chip);
    });
  } else {
    banRow.style.display = 'none';
  }
}

function renderActivitySelects() {
  const grades = gradesAvailable();
  const row = document.getElementById('activitySlotRow');
  row.innerHTML = grades.map(g => {
    return allSlotsForGrade(g).map(slot => {
      const opts = slotOptions(g, slot.id);
      if (!opts.length) return '';
      const selected = activityFilter && activityFilter.grade === g && activityFilter.slotId === slot.id;
      return `<select class="activity-select${selected ? ' locked' : ''}" data-grade="${g}" data-slot-id="${slot.id}" data-sem="${slot.sem}" data-label="${escAttr(slot.label)}" onchange="onActivitySelect(this)">
        <option value="">${g}학년 ${slot.sem}학기 ${esc(slot.label)}</option>
        ${opts.map(o => `<option value="${escAttr(o)}"${selected && activityFilter.value === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}
      </select>`;
    }).join('');
  }).join('');
}

function clearActivityFilterSelects() {
  document.querySelectorAll('.activity-select').forEach(sel => { sel.value = ''; sel.classList.remove('locked'); });
}

window.onActivitySelect = function(selectEl) {
  const value = selectEl.value;
  if (!value) { activityFilter = null; renderAll(); return; }
  activityFilter = {
    grade: selectEl.dataset.grade,
    sem: Number(selectEl.dataset.sem),
    slotId: selectEl.dataset.slotId,
    label: selectEl.dataset.label,
    value,
  };
  activeGrade = selectEl.dataset.grade;
  activeBan = '';
  document.querySelectorAll('.activity-select').forEach(sel => { if (sel !== selectEl) sel.value = ''; });
  renderAll();
};

window.resetActivityFilter = function() {
  activityFilter = null;
  activeBan = '';
  clearActivityFilterSelects();
  renderAll();
};

function renderAll() {
  renderGradeChips();
  renderActivitySelects();
  renderActiveFilterBanner();
  renderResults();
}

function renderActiveFilterBanner() {
  const banner = document.getElementById('activeFilterBanner');
  if (!activityFilter) { banner.style.display = 'none'; return; }
  document.getElementById('activeFilterText').textContent =
    `${activityFilter.grade}학년 ${activityFilter.sem}학기 ${activityFilter.label} "${activityFilter.value}" 그룹만 표시 중`;
  banner.style.display = 'flex';
}

function activitiesText(s, sem) {
  const slots = slotsFor(s.grade, sem);
  if (!slots.length) return '';
  const parts = slots.map(slot => {
    const v = (s.assignments || {})[slot.id] || '';
    return slots.length === 1 ? v : `${slot.label}: ${v || '미배정'}`;
  }).filter(Boolean);
  return parts.join(slots.length === 1 ? '' : ' · ');
}

function studentMatchesActivity(s) {
  if (!activityFilter) return true;
  if (String(s.grade) !== String(activityFilter.grade)) return false;
  return (s.assignments || {})[activityFilter.slotId] === activityFilter.value;
}

function filteredSortedResults() {
  const q = document.getElementById('searchBox').value;
  let results = allStudents;
  if (activityFilter) {
    results = results.filter(studentMatchesActivity);
  } else {
    if (activeGrade) results = results.filter(s => String(s.grade) === activeGrade);
    if (activeBan) results = results.filter(s => String(s.ban) === activeBan);
  }
  results = fuzzySearch(results, q, ['_searchText']);
  return results.slice().sort((a, b) => {
    if (a.grade !== b.grade) return a.grade - b.grade;
    if (a.ban !== b.ban) return a.ban - b.ban;
    return a.num - b.num;
  });
}

function renderResults() {
  const results = filteredSortedResults();

  const wrap = document.getElementById('listWrap');
  if (!results.length) {
    wrap.innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
    return;
  }

  let html = `<div class="result-count">${results.length}명</div>`;
  html += '<table class="stu-table"><thead><tr>';
  html += '<th>학년</th><th>반</th><th>번호</th><th>학번</th><th>이름</th><th>이메일</th>';
  html += '<th>1학기 활동</th><th>2학기 활동</th>';
  html += '</tr></thead><tbody>';
  let prevBanKey = null;
  let banColorIdx = -1;
  html += results.map(s => {
    const cell = (v) => v ? esc(v) : '<span class="cell-empty">미배정</span>';
    const banKey = `${s.grade}-${s.ban}`;
    const isBanStart = banKey !== prevBanKey;
    if (isBanStart) { prevBanKey = banKey; banColorIdx = (banColorIdx + 1) % 2; }
    return `<tr class="${isBanStart ? 'ban-start ' : ''}${banColorIdx === 1 ? 'ban-alt' : ''}">
      <td>${esc(s.grade)}</td><td>${esc(s.ban)}</td><td>${esc(s.num)}</td><td>${esc(s.id)}</td><td>${esc(s.name)}</td>
      <td style="font-size:0.78rem;color:var(--text-muted)">${esc(s.email||'')}</td>
      <td class="activity-cell">${cell(activitiesText(s, 1))}</td>
      <td class="activity-cell">${cell(activitiesText(s, 2))}</td>
    </tr>`;
  }).join('');
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function printRoster() {
  const results = filteredSortedResults();
  if (!results.length) { alert('출력할 학생이 없습니다.'); return; }

  const groupMap = new Map();
  if (activityFilter) {
    const title = `${activityFilter.grade}학년 ${activityFilter.value}`;
    groupMap.set(title, results);
  } else {
    results.forEach(s => {
      const key = `${s.grade}학년 ${s.ban}반`;
      if (!groupMap.has(key)) groupMap.set(key, []);
      groupMap.get(key).push(s);
    });
  }

  const today = new Date().toLocaleDateString('ko-KR');
  const withEmail = document.getElementById('includeEmailChk').checked;

  const pages = [...groupMap.entries()].map(([className, students], pi) => {
    const PER_COL = withEmail ? students.length : 30;
    const COLS = withEmail ? 1 : Math.ceil(students.length / PER_COL);
    const rows = withEmail ? students.length : PER_COL;

    const colData = Array.from({length: COLS}, (_, c) =>
      Array.from({length: rows}, (_, r) => students[c * rows + r] || null)
    );

    const headerRow = Array.from({length: COLS}, (_, i) => {
      const emailCol = withEmail ? '<th class="c-email">이메일</th>' : '';
      return `<th class="c-id">학번</th><th class="c-gender">성별</th><th class="c-name">이름</th>${emailCol}<th class="c-sign">비고</th>${i < COLS-1 ? '<th class="c-sep"></th>' : ''}`;
    }).join('');

    const finalBodyRows = Array.from({length: rows}, (_, r) =>
      `<tr>${Array.from({length: COLS}, (_, c) => {
        const s = colData[c][r];
        const sep = c < COLS - 1 ? '<td class="c-sep"></td>' : '';
        if (!s) return `<td class="c-id"></td><td class="c-gender"></td><td class="c-name"></td>${withEmail ? '<td class="c-email"></td>' : ''}<td class="c-sign"></td>${sep}`;
        const emailCell = withEmail ? `<td class="c-email">${s.email||''}</td>` : '';
        return `<td class="c-id">${s.id}</td><td class="c-gender">${s.gender||''}</td><td class="c-name">${s.name}</td>${emailCell}<td class="c-sign"></td>${sep}`;
      }).join('')}</tr>`
    ).join('');

    return `
    <div class="page${pi > 0 ? ' break' : ''}">
      <div class="ph">
        <span class="ph-title">광수중학교 ${className} 명렬표</span>
        <span class="ph-meta">${students.length}명 &nbsp;·&nbsp; ${today} 출력</span>
      </div>
      <table>
        <thead><tr>${headerRow}</tr></thead>
        <tbody>${finalBodyRows}</tbody>
      </table>
    </div>`;
  }).join('');

  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>명렬표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:10pt;color:#000;background:#fff}
.page{padding:8mm 10mm 6mm}
.break{page-break-before:always}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;border-bottom:2px solid #000;padding-bottom:4px}
.ph-title{font-size:14pt;font-weight:700}
.ph-meta{font-size:8.5pt;color:#444}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #666;text-align:center;vertical-align:middle;padding:1px 2px;height:20px}
th{background:#ddd;font-size:8.5pt;font-weight:700}
td{font-size:9.5pt}
.c-id{width:38px;font-size:8.5pt}
.c-gender{width:24px}
.c-name{width:58px;text-align:left;padding-left:5px}
.c-email{font-size:7.5pt;text-align:left;padding-left:4px}
.c-sign{width:46px}
.c-sep{width:6px;border:none;background:#fff}
@page{size:A4 portrait;margin:5mm}
</style>
</head><body>
${pages}
<script>window.onload=function(){window.print();}<\/script>
</body></html>`);
  win.document.close();
}

function downloadExcel() {
  const withEmail = document.getElementById('includeEmailChk').checked;
  const results = filteredSortedResults();
  if (!results.length) { alert('다운로드할 학생이 없습니다.'); return; }

  const q2 = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const headers = ['학년', '반', '번호', '학번', '이름'];
  if (withEmail) headers.push('이메일');
  headers.push('1학기 활동', '2학기 활동');

  const rows = results.map(s => {
    const row = [s.grade, s.ban, s.num, s.id, s.name];
    if (withEmail) row.push(s.email || '');
    row.push(activitiesText(s, 1), activitiesText(s, 2));
    return row.map(q2).join(',');
  });

  const csv = '﻿' + [headers.map(q2).join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const dateStr = new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','');
  const label = activeGrade ? `${activeGrade}학년${activeBan ? activeBan+'반' : ''}` : '전체';
  a.download = `학생명단_${label}_${dateStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
window.printRoster = printRoster;
window.downloadExcel = downloadExcel;

async function loadCurrentConfig() {
  const snap = await get(ref(db, 'config/current'));
  if (snap.exists()) return snap.val();
  return { year: new Date().getFullYear(), sem: 1 };
}

async function loadSlots(year) {
  const snap = await get(ref(db, `years/${year}/slots`));
  if (!snap.exists()) return {};
  const raw = snap.val();
  const out = {};
  Object.entries(raw).forEach(([grade, semMap]) => {
    out[grade] = {};
    Object.entries(semMap || {}).forEach(([sem, slotMap]) => {
      out[grade][sem] = Object.entries(slotMap || {})
        .map(([id, v]) => ({ id, label: v.label, order: v.order || 0 }))
        .sort((a, b) => a.order - b.order);
    });
  });
  return out;
}

async function loadStudents(year) {
  const snap = await get(ref(db, `years/${year}/students`));
  if (!snap.exists()) return [];
  const map = snap.val();
  return Object.entries(map).map(([id, s]) => ({
    id, grade: s.grade, ban: s.ban, num: s.num, name: s.name,
    gender: s.gender || '', email: s.email || '', assignments: s.assignments || {},
  }));
}

async function reloadRoster() {
  const cfg = await loadCurrentConfig();
  currentYear = cfg.year;
  currentSem = cfg.sem;
  document.getElementById('currentSemLabel').textContent = `${currentYear}학년도 ${currentSem}학기 기준`;

  const [students, slots] = await Promise.all([loadStudents(currentYear), loadSlots(currentYear)]);
  slotsByGradeSem = slots;
  allStudents = students.map(s => ({ ...s, _searchText: '' }));
  allStudents.forEach(s => { s._searchText = studentSearchText(s); });
  renderAll();
}

// ── 학번 조회 ──────────────────────────────
let lookupNames = [];

window.openIdLookup = function() {
  lookupNames = [];
  renderLookupChips();
  document.getElementById('idLookupInput').value = '';
  document.getElementById('idLookupResult').innerHTML = '';
  document.getElementById('idLookupSearchBtn').disabled = true;
  document.getElementById('idLookupModal').style.display = 'flex';
  setTimeout(() => document.getElementById('idLookupInput').focus(), 50);
};

window.closeIdLookup = function() {
  document.getElementById('idLookupModal').style.display = 'none';
};

window.addLookupName = function() {
  const input = document.getElementById('idLookupInput');
  const name = input.value.trim();
  if (name && !lookupNames.includes(name)) {
    lookupNames.push(name);
    renderLookupChips();
  }
  input.value = '';
  input.focus();
};

window.removeLookupName = function(idx) {
  lookupNames.splice(idx, 1);
  renderLookupChips();
};

function renderLookupChips() {
  const wrap = document.getElementById('idLookupChips');
  const btn = document.getElementById('idLookupSearchBtn');
  if (!lookupNames.length) {
    wrap.innerHTML = '<span style="font-size:0.8rem;color:var(--text-muted)">아직 입력된 이름이 없습니다.</span>';
    btn.disabled = true;
    return;
  }
  wrap.innerHTML = lookupNames.map((n, i) =>
    `<span class="lookup-name-chip">${esc(n)}<button onclick="removeLookupName(${i})">✕</button></span>`
  ).join('');
  btn.disabled = false;
}

window.runIdLookup = function() {
  if (!lookupNames.length) return;

  const nameGroups = lookupNames.map(name => {
    const matches = allStudents
      .filter(s => s.name === name)
      .sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
    return { name, students: matches };
  });

  nameGroups.sort((a, b) => {
    const aMin = a.students.length ? String(a.students[0].id) : '9999';
    const bMin = b.students.length ? String(b.students[0].id) : '9999';
    return aMin.localeCompare(bMin, undefined, { numeric: true });
  });

  const results = nameGroups.flatMap(g => g.students);
  const notFound = nameGroups.filter(g => !g.students.length).map(g => g.name);

  const resultEl = document.getElementById('idLookupResult');
  let html = '';

  if (notFound.length) {
    html += `<div style="font-size:0.82rem;color:#c0392b;margin-bottom:8px">찾을 수 없음: ${notFound.map(n => esc(n)).join(', ')}</div>`;
  }

  if (!results.length) {
    html += '<div class="empty-state">일치하는 학생이 없습니다.</div>';
    resultEl.innerHTML = html;
    return;
  }

  html += `<div style="font-size:0.82rem;color:var(--text-muted);margin-bottom:8px">${results.length}명 검색됨</div>`;
  html += '<table class="stu-table"><thead><tr><th>학번</th><th>이름</th><th>학년</th><th>반</th><th>번호</th></tr></thead><tbody>';

  const nameCounts = {};
  results.forEach(s => { nameCounts[s.name] = (nameCounts[s.name] || 0) + 1; });

  html += results.map(s => {
    const isDup = nameCounts[s.name] > 1;
    return `<tr${isDup ? ' style="background:rgba(255,193,7,0.12)"' : ''}>
      <td><strong>${esc(s.id)}</strong></td>
      <td>${esc(s.name)}${isDup ? ' <span style="font-size:0.7rem;color:#b07700">(동명이인)</span>' : ''}</td>
      <td>${esc(s.grade)}</td><td>${esc(s.ban)}</td><td>${esc(s.num)}</td>
    </tr>`;
  }).join('');
  html += '</tbody></table>';
  resultEl.innerHTML = html;
};

let debounceTimer = null;
document.getElementById('searchBox').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(renderResults, 150);
});

window.addEventListener('DOMContentLoaded', function() {
  showExternalBrowserBannerIfNeeded('inappBanner');

  document.getElementById('idLookupInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addLookupName(); }
  });
  document.getElementById('idLookupModal').addEventListener('click', e => {
    if (e.target.id === 'idLookupModal') closeIdLookup();
  });

  reloadRoster().catch(err => {
    document.getElementById('currentSemLabel').textContent = '불러오기 실패';
    document.getElementById('listWrap').innerHTML =
      `<div class="empty-state">불러오기 실패: ${esc(err.message || String(err))}</div>`;
  });
});
</script>
