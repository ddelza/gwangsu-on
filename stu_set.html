    'claude':      'Nanum+Myeongjo',

    var t=localStorage.getItem('gwangsu_theme')||'';

      var p=document.createElement('link');p.rel='preconnect';p.href='https://fonts.googleapis.com';document.head.appendChild(p);

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// 현장에서 학생 이름을 하나씩 타이핑해 특정 반/그룹에 즉시 배정하는 빠른 도구.
// admin.html의 학생정보 표 편집과 동일한 /years/{year}/students/{id}/assignments/{slotId}를 쓴다 —
// 데이터 모델은 admin.html과 완전히 공유하고, 이 페이지는 "이름으로 빠르게 한 명씩 넣는" 입력 UX만 다르다.
const firebaseConfig = {
  apiKey: "AIzaSyB_D2Wi944YQL-1rCdgeNU-tD8lpMek_wM",
  authDomain: "gwangsu-on.firebaseapp.com",
  databaseURL: "https://gwangsu-on-default-rtdb.firebaseio.com",
  projectId: "gwangsu-on",
  storageBucket: "gwangsu-on.firebasestorage.app",
  messagingSenderId: "684885628658",
  appId: "1:684885628658:web:b471726b604754a82b626b",
  measurementId: "G-6X5DH4EP5N"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function detectInAppBrowser() {
  const ua = navigator.userAgent || '';
  return /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua);
}
window.openInExternalBrowser = function() {
  const url = window.location.href;
  const ua = navigator.userAgent || '';
  if (/KAKAOTALK/i.test(ua)) window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
  else if (/NAVER/i.test(ua)) window.location.href = 'naversearchapp://inappbrowser?app=naversearchapp&url=' + encodeURIComponent(url);
  else window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
};

let currentYear = null;
let currentConfigSem = 1;
let students = []; // 전체 학년 (이름 검색용), { id, grade, ban, num, name, assignments }
let slots = {};     // { [grade]: { [sem]: [{id,label,order}] } }
let groupOptions = {}; // { [slotId]: [names...] }

async function loadCurrentConfig() {
  const snap = await get(ref(db, 'config/current'));
  if (snap.exists()) return snap.val();
  return { year: new Date().getFullYear(), sem: 1 };
}

async function loadAll(year) {
  const [studentsSnap, slotsSnap, groupOptSnap] = await Promise.all([
    get(ref(db, `years/${year}/students`)),
    get(ref(db, `years/${year}/slots`)),
    get(ref(db, `years/${year}/groupOptions`)),
  ]);
  students = studentsSnap.exists()
    ? Object.entries(studentsSnap.val()).map(([id, s]) => ({ id, grade: s.grade, ban: s.ban, num: s.num, name: s.name, assignments: s.assignments || {} }))
    : [];
  const rawSlots = slotsSnap.exists() ? slotsSnap.val() : {};
  slots = {};
  ['1', '2', '3'].forEach(g => {
    slots[g] = {};
    ['1', '2'].forEach(sem => {
      const m = (rawSlots[g] && rawSlots[g][sem]) || {};
      slots[g][sem] = Object.entries(m).map(([id, v]) => ({ id, label: v.label, order: v.order || 0 })).sort((a, b) => a.order - b.order);
    });
  });
  groupOptions = groupOptSnap.exists() ? groupOptSnap.val() : {};
}

async function init() {
  const cfg = await loadCurrentConfig();
  currentYear = cfg.year;
  currentConfigSem = cfg.sem;
  document.getElementById('currentSemLabel').textContent = `${currentYear}학년도 ${currentConfigSem}학기 기준으로 배정합니다`;
  await loadAll(currentYear);
}

function selectedGrade() { return document.getElementById('gradeSelect').value; }
function selectedActivity() {
  const v = document.getElementById('activitySelect').value;
  if (!v) return null;
  const [slotId, ...rest] = v.split('::');
  return { slotId, groupName: rest.join('::') };
}

window.onGradeChange = function() {
  const grade = selectedGrade();
  const activitySelect = document.getElementById('activitySelect');
  const nameInput = document.getElementById('nameInput');
  const addBtn = document.getElementById('addBtn');
  document.getElementById('feedbackMsg').textContent = '';

  if (!grade) {
    activitySelect.innerHTML = '<option value="">학년을 먼저 선택하세요</option>';
    activitySelect.disabled = true;
    nameInput.disabled = true; addBtn.disabled = true;
    renderRoster();
    return;
  }

  const gradeSlots = slots[grade][currentConfigSem] || [];
  const options = [];
  gradeSlots.forEach(slot => {
    (groupOptions[slot.id] || []).forEach(groupName => {
      options.push({ value: `${slot.id}::${groupName}`, text: `${slot.label}: ${groupName}` });
    });
  });

  if (!options.length) {
    activitySelect.innerHTML = '<option value="">이 학년·학기에는 반/그룹 이름이 아직 없습니다 (관리자 페이지에서 먼저 등록해주세요)</option>';
    activitySelect.disabled = true;
    nameInput.disabled = true; addBtn.disabled = true;
    renderRoster();
    return;
  }

  activitySelect.innerHTML = '<option value="">활동명 선택</option>' +
    options.map(o => `<option value="${o.value}">${esc(o.text)}</option>`).join('');
  activitySelect.disabled = false;
  nameInput.disabled = true; addBtn.disabled = true;
  renderRoster();
};

window.onActivityChange = function() {
  const activity = selectedActivity();
  const nameInput = document.getElementById('nameInput');
  const addBtn = document.getElementById('addBtn');
  document.getElementById('feedbackMsg').textContent = '';
  nameInput.disabled = !activity;
  addBtn.disabled = !activity;
  if (activity) { nameInput.value = ''; nameInput.focus(); }
  renderRoster();
};

function renderRoster() {
  const grade = selectedGrade();
  const activity = selectedActivity();
  const titleEl = document.getElementById('rosterTitle');
  const listEl = document.getElementById('rosterList');

  if (!grade || !activity) {
    titleEl.textContent = '활동명을 선택하면 배정된 학생 목록이 여기 보입니다.';
    listEl.innerHTML = '';
    return;
  }

  const assigned = students.filter(s => String(s.grade) === grade && (s.assignments || {})[activity.slotId] === activity.groupName)
    .sort((a, b) => (Number(a.ban) - Number(b.ban)) || (Number(a.num) - Number(b.num)));

  titleEl.textContent = `현재 배정된 학생 (${assigned.length}명)`;
  listEl.innerHTML = assigned.length
    ? assigned.map(s => `<div class="roster-item">
        <span>${esc(s.name)} <span class="meta">${esc(s.grade)}학년 ${esc(s.ban)}반 ${esc(s.num)}번</span></span>
        <button onclick="unassign('${esc(s.id)}')">제거</button>
      </div>`).join('')
    : '<div class="empty-hint">아직 배정된 학생이 없습니다.</div>';
}

async function assignStudent(studentId) {
  const activity = selectedActivity();
  const s = students.find(x => x.id === studentId);
  s.assignments[activity.slotId] = activity.groupName;
  await update(ref(db), { [`years/${currentYear}/students/${studentId}/assignments/${activity.slotId}`]: activity.groupName });
  renderRoster();
}

window.unassign = async function(studentId) {
  const activity = selectedActivity();
  const s = students.find(x => x.id === studentId);
  if (s) s.assignments[activity.slotId] = '';
  await update(ref(db), { [`years/${currentYear}/students/${studentId}/assignments/${activity.slotId}`]: '' });
  renderRoster();
};

function showFeedback(msg, ok) {
  const el = document.getElementById('feedbackMsg');
  el.textContent = msg;
  el.className = 'feedback-msg ' + (ok ? 'ok' : 'err');
}

window.submitName = async function() {
  const grade = selectedGrade();
  const activity = selectedActivity();
  const nameInput = document.getElementById('nameInput');
  const name = nameInput.value.trim();
  if (!grade || !activity || !name) return;

  const candidates = students.filter(s => String(s.grade) === grade && s.name === name);
  if (!candidates.length) {
    showFeedback(`"${name}" 학생을 ${grade}학년에서 찾을 수 없습니다.`, false);
    return;
  }
  if (candidates.length === 1) {
    await assignStudent(candidates[0].id);
    showFeedback(`${name} 학생을 배정했습니다.`, true);
    nameInput.value = '';
    nameInput.focus();
    return;
  }
  openDupModal(name, candidates);
};

function openDupModal(name, candidates) {
  document.getElementById('dupModalTitle').textContent = `"${name}" — 동명이인 ${candidates.length}명`;
  const listEl = document.getElementById('dupCandidateList');
  listEl.innerHTML = candidates
    .sort((a, b) => (Number(a.ban) - Number(b.ban)) || (Number(a.num) - Number(b.num)))
    .map(s => `<button class="dup-candidate" onclick="pickDup('${esc(s.id)}','${esc(name)}')">
      <span>${esc(s.name)}</span><span class="meta">${esc(s.grade)}학년 ${esc(s.ban)}반 ${esc(s.num)}번 · 학번 ${esc(s.id)}</span>
    </button>`).join('');
  document.getElementById('dupModal').style.display = 'flex';
}
window.closeDupModal = function() { document.getElementById('dupModal').style.display = 'none'; };
window.pickDup = async function(studentId, name) {
  await assignStudent(studentId);
  closeDupModal();
  showFeedback(`${name} 학생을 배정했습니다.`, true);
  const nameInput = document.getElementById('nameInput');
  nameInput.value = '';
  nameInput.focus();
};

document.getElementById('gradeSelect').addEventListener('change', onGradeChange);
document.getElementById('activitySelect').addEventListener('change', onActivityChange);
document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); submitName(); }
});
document.getElementById('dupModal').addEventListener('click', (e) => {
  if (e.target.id === 'dupModal') closeDupModal();
});

window.addEventListener('DOMContentLoaded', function() {
  if (detectInAppBrowser()) { const el = document.getElementById('inappBanner'); if (el) el.style.display = 'block'; }
  init().catch(err => {
    document.getElementById('currentSemLabel').textContent = '불러오기 실패: ' + (err.message || String(err));
  });
});
</script>
</body>
</html>
